<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root { --bg:#050409; --panel:#121019; --ink:#f4f1ff; --muted:#9a94b8; --line:#2a2540; --a:#3df5ff; --b:#ffc83d; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; touch-action:manipulation;
    font-family:Inter,-apple-system,system-ui,sans-serif; -webkit-user-select:none; user-select:none; }
  canvas.layer { position:fixed; left:0; top:0; width:100vw; height:100vh; height:100dvh; display:block; }
  #hud { pointer-events:none; }
  #setup { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:16px;
    background:radial-gradient(120% 70% at 50% 0%, rgba(61,245,255,.18), transparent 60%), rgba(5,4,9,.95); overflow:auto; }
  #setup.hidden { display:none; }
  .card { width:100%; max-width:420px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px 20px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .card h1 { font-family:Teko,Impact,sans-serif; font-weight:700; letter-spacing:2px; font-size:48px; margin:0; line-height:.95;
    background:linear-gradient(90deg,var(--a),#9be7ff 45%,var(--b) 55%,#ffe08a); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .card p.sub { margin:4px 0 14px; color:var(--muted); font-size:14px; line-height:1.4; }
  label { display:block; font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:12px 0 6px; }
  input[type=text] { width:100%; box-sizing:border-box; background:#09080f; color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:12px; font-size:16px; font-family:inherit; outline:none; }
  .chk { display:flex; align-items:center; gap:10px; margin-top:12px; font-size:14px; text-transform:none; letter-spacing:0; font-weight:600; color:var(--ink); }
  .chk input { width:20px; height:20px; accent-color:var(--a); flex:none; }
  .btns { display:flex; gap:10px; margin-top:18px; }
  button { flex:1; border:0; border-radius:12px; padding:14px; font-size:16px; font-weight:800; font-family:inherit; cursor:pointer; }
  #go { background:linear-gradient(90deg,#00b3c7,var(--a)); color:#001518; }
  #demo { background:#221d33; color:var(--ink); }
  #status { margin-top:12px; font-size:13px; color:var(--muted); min-height:18px; }
  #menu { position:fixed; right:10px; bottom:10px; z-index:5; width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.08); color:#fff; border:0; font-size:16px; padding:0; opacity:.35; }
</style>
</head>
<body>
<canvas id="gl" class="layer"></canvas>
<canvas id="hud" class="layer"></canvas>
<button id="menu" title="Settings">⚙︎</button>
<div id="setup">
  <div class="card">

    <p class="sub">Viewers comment their country to join the race. Comments and likes push their flag, gifts give turbo boosts. Each race lasts about 2 to 4 minutes, then a new one starts automatically.</p>
    <label for="user">Your TikTok @</label>
    <input id="user" type="text" placeholder="automadesk" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label class="chk"><input id="music" type="checkbox" checked> Music and sound effects</label>
    <div class="btns"><button id="go">Start live</button><button id="demo">Demo</button></div>
    <div id="status"></div>
  </div>
</div>
<script type="module">

// ================= countries =================
const C = [
  ['BR', 'Brazil', 'brasil brazil brasileiro brasileira br'], ['US', 'USA', 'usa eua america united states estados unidos us'], ['MX', 'Mexico', 'mexico méxico mexicano'],
  ['PT', 'Portugal', 'portugal portugues português'], ['AR', 'Argentina', 'argentina argentino'], ['CO', 'Colombia', 'colombia colômbia colombiano'],
  ['ES', 'Spain', 'spain espanha españa espana'], ['FR', 'France', 'france frança francia'], ['DE', 'Germany', 'germany alemanha alemania deutschland'],
  ['IT', 'Italy', 'italy italia itália'], ['GB', 'UK', 'uk england inglaterra reino unido united kingdom britain'], ['CA', 'Canada', 'canada canadá'],
  ['PE', 'Peru', 'peru perú'], ['CL', 'Chile', 'chile chileno'], ['VE', 'Venezuela', 'venezuela venezolano'], ['EC', 'Ecuador', 'ecuador equador'],
  ['BO', 'Bolivia', 'bolivia bolívia'], ['PY', 'Paraguay', 'paraguay paraguai'], ['UY', 'Uruguay', 'uruguay uruguai'], ['CU', 'Cuba', 'cuba'],
  ['DO', 'Dominican Rep.', 'dominicana republica dominicana dominican'], ['PR', 'Puerto Rico', 'puerto rico porto rico'], ['GT', 'Guatemala', 'guatemala'],
  ['HN', 'Honduras', 'honduras'], ['SV', 'El Salvador', 'el salvador salvador'], ['NI', 'Nicaragua', 'nicaragua'], ['CR', 'Costa Rica', 'costa rica'],
  ['PA', 'Panama', 'panama panamá'], ['HT', 'Haiti', 'haiti haití'], ['JM', 'Jamaica', 'jamaica'], ['AO', 'Angola', 'angola'], ['MZ', 'Mozambique', 'mozambique moçambique mocambique'],
  ['CV', 'Cape Verde', 'cabo verde cape verde'], ['NG', 'Nigeria', 'nigeria nigéria'], ['GH', 'Ghana', 'ghana gana'], ['ZA', 'South Africa', 'south africa africa do sul áfrica do sul'],
  ['MA', 'Morocco', 'morocco marrocos marruecos'], ['EG', 'Egypt', 'egypt egito egipto'], ['KE', 'Kenya', 'kenya quenia quênia'], ['SN', 'Senegal', 'senegal'],
  ['TR', 'Turkey', 'turkey turquia türkiye'], ['RU', 'Russia', 'russia rússia rusia'], ['UA', 'Ukraine', 'ukraine ucrania ucrânia'], ['PL', 'Poland', 'poland polonia polônia'],
  ['NL', 'Netherlands', 'netherlands holanda holland paises baixos'], ['BE', 'Belgium', 'belgium bélgica belgica'], ['CH', 'Switzerland', 'switzerland suíça suiza suica'],
  ['SE', 'Sweden', 'sweden suécia suecia'], ['NO', 'Norway', 'norway noruega'], ['IE', 'Ireland', 'ireland irlanda'], ['RO', 'Romania', 'romania romênia rumania'],
  ['GR', 'Greece', 'greece grécia grecia'], ['IN', 'India', 'india índia'], ['PK', 'Pakistan', 'pakistan paquistão paquistao'], ['BD', 'Bangladesh', 'bangladesh'],
  ['PH', 'Philippines', 'philippines filipinas pinoy'], ['ID', 'Indonesia', 'indonesia indonésia'], ['MY', 'Malaysia', 'malaysia malásia malasia'], ['VN', 'Vietnam', 'vietnam vietnã'],
  ['TH', 'Thailand', 'thailand tailândia tailandia'], ['JP', 'Japan', 'japan japão japon japao'], ['KR', 'Korea', 'korea coreia corea'], ['CN', 'China', 'china'],
  ['SA', 'Saudi Arabia', 'saudi arabia arabia saudita'], ['AE', 'UAE', 'uae emirados dubai emirates'], ['IL', 'Israel', 'israel'], ['IR', 'Iran', 'iran irã'],
  ['IQ', 'Iraq', 'iraq iraque irak'], ['DZ', 'Algeria', 'algeria argélia argelia'], ['AU', 'Australia', 'australia austrália'], ['NZ', 'New Zealand', 'new zealand nova zelandia nueva zelanda'],
];
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const flagOf = (iso) => String.fromCodePoint(...[...iso].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
const BY = new Map(); const ALIAS = [];
for (const [iso, name] of C) BY.set(iso, { iso, name, flag: flagOf(iso) });
// build aliases: phrases first (longest), then single words
for (const [iso, name, al] of C) {
  const words = al.split(' '); const phrases = [];
  const multi = { 'united states': 1, 'estados unidos': 1, 'reino unido': 1, 'united kingdom': 1, 'south africa': 1, 'africa do sul': 1, 'áfrica do sul': 1, 'saudi arabia': 1, 'arabia saudita': 1,
    'new zealand': 1, 'nova zelandia': 1, 'nueva zelanda': 1, 'costa rica': 1, 'puerto rico': 1, 'porto rico': 1, 'el salvador': 1, 'republica dominicana': 1, 'cabo verde': 1, 'cape verde': 1, 'paises baixos': 1 };
  for (const m of Object.keys(multi)) if (al.includes(m)) phrases.push(m);
  for (const w of words) if (w.length >= 3 || ['us', 'uk', 'br'].includes(w)) phrases.push(w);
  for (const p of phrases) ALIAS.push([norm(p), iso]);
}
ALIAS.sort((a, b) => b[0].length - a[0].length);
const SHORT = new Set(['us', 'uk', 'br']);
function detectCountry(text) {
  const raw = String(text || '');
  const fm = raw.match(/[\u{1F1E6}-\u{1F1FF}]{2}/u);
  if (fm) { const cps = [...fm[0]].map(c => String.fromCharCode(c.codePointAt(0) - 0x1F1E6 + 65)).join(''); if (BY.has(cps)) return cps; }
  const t = ' ' + norm(raw).replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
  for (const [a, iso] of ALIAS) {
    if (SHORT.has(a)) { if (t.trim() === a) return iso; continue; }
    if (t.includes(' ' + a + ' ')) return iso;
  }
  return null;
}

// ================= state =================
const DIST = 200, LANES = 8, LANE_W = 1.35;
const G = { race: 0, phase: 'setup', phaseT: 0, time: 0, racers: [], users: new Map(), feed: [], spot: null, winner: null, wins: new Map(), shake: 0, hype: 0, lastLeader: null, demo: false, started: false };
const SH = { G: { phase: 'intro', round: 0, fury: 0, crowdHype: 0, spot: null, feed: [], hearts: [], shake: 0, started: false, time: 0 }, F: [{ comboN: 0 }, { comboN: 0 }], cfg: { voice: false } };
window.__ringue = SH; // drives the shared soundtrack/SFX module (fx.js)

// ================= three.js scene =================
const gl = $('gl'), hud = $('hud'), hx = hud.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05040c); scene.fog = new THREE.Fog(0x05040c, 22, 70);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.75, 0.5, 0.82); composer.addPass(bloom); composer.addPass(new OutputPass());
scene.add(new THREE.HemisphereLight(0x8fb8ff, 0x1a0f2a, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(4, 10, 6); scene.add(sun); scene.add(sun.target);

const TW = LANES * LANE_W;
// track surface (scrolling grid texture)
function gridTex() {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256; const x = cv.getContext('2d');
  x.fillStyle = '#0d0b1c'; x.fillRect(0, 0, 256, 256);
  x.strokeStyle = 'rgba(120,110,255,.22)'; x.lineWidth = 2; x.beginPath(); x.moveTo(0, 0); x.lineTo(256, 0); x.stroke();
  x.strokeStyle = 'rgba(120,110,255,.08)'; x.beginPath(); x.moveTo(0, 128); x.lineTo(256, 128); x.stroke();
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, (DIST + 60) / 4); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const track = new THREE.Mesh(new THREE.PlaneGeometry(TW + 0.6, DIST + 60), new THREE.MeshStandardMaterial({ map: gridTex(), roughness: 0.55, metalness: 0.3 }));
track.rotation.x = -Math.PI / 2; track.position.z = -(DIST + 60) / 2 + 20; scene.add(track);
// lane lines
const laneMat = new THREE.MeshBasicMaterial({ color: 0x6f62ff, transparent: true, opacity: 0.35 });
for (let i = 1; i < LANES; i++) { const l = new THREE.Mesh(new THREE.PlaneGeometry(0.03, DIST + 60), laneMat); l.rotation.x = -Math.PI / 2; l.position.set(-TW / 2 + i * LANE_W, 0.005, track.position.z); scene.add(l); }
// neon rails
const railMats = [new THREE.MeshBasicMaterial({ color: new THREE.Color(0x3df5ff).multiplyScalar(2.2) }), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xff2d95).multiplyScalar(2.2) })];
for (const s of [-1, 1]) { const r = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, DIST + 60), railMats[s < 0 ? 0 : 1]); r.position.set(s * (TW / 2 + 0.35), 0.18, track.position.z); scene.add(r);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(DIST + 60, 1.6), new THREE.MeshBasicMaterial({ color: s < 0 ? 0x08303a : 0x3a0828, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }));
  wall.rotation.y = Math.PI / 2; wall.position.set(s * (TW / 2 + 0.4), 0.8, track.position.z); scene.add(wall); }
// distance gates every 25 m
function textTex(lines, w = 512, h = 128, bg = null, col = '#fff') {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const x = cv.getContext('2d');
  if (bg) { x.fillStyle = bg; x.fillRect(0, 0, w, h); }
  x.fillStyle = col; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = `700 ${Math.round(h * 0.8)}px Teko, Impact, sans-serif`; x.fillText(lines, w / 2, h * 0.55);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const gates = [];
for (let d = 25; d < DIST; d += 25) {
  const g = new THREE.Group(); g.position.z = -d;
  const col = d % 50 === 0 ? 0x3df5ff : 0xb9a8ff;
  const m = new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(1.8) });
  const arc = new THREE.Mesh(new THREE.TorusGeometry(TW / 2 + 0.6, 0.06, 8, 48, Math.PI), m); g.add(arc);
  const lbl = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 0.6), new THREE.MeshBasicMaterial({ map: textTex(d + ' M'), transparent: true, depthWrite: false }));
  lbl.position.y = TW / 2 + 1.1; g.add(lbl); scene.add(g); gates.push(g);
}
// finish line
const checker = (() => { const cv = document.createElement('canvas'); cv.width = 256; cv.height = 32; const x = cv.getContext('2d');
  for (let i = 0; i < 16; i++) for (let j = 0; j < 2; j++) { x.fillStyle = (i + j) % 2 ? '#111' : '#fff'; x.fillRect(i * 16, j * 16, 16, 16); }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const finish = new THREE.Group(); finish.position.z = -DIST; scene.add(finish);
{ const fl = new THREE.Mesh(new THREE.PlaneGeometry(TW, 1), new THREE.MeshBasicMaterial({ map: checker })); fl.rotation.x = -Math.PI / 2; fl.position.y = 0.01; finish.add(fl);
  const pm = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.8, roughness: 0.3 });
  for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 4.2, 12), pm); p.position.set(s * (TW / 2 + 0.5), 2.1, 0); finish.add(p); }
  const ban = new THREE.Mesh(new THREE.PlaneGeometry(TW + 1.2, 1.1), new THREE.MeshBasicMaterial({ map: textTex('🏁 FINISH 🏁', 1024, 128, '#111', '#ffe08a'), side: THREE.DoubleSide }));
  ban.position.y = 4.1; finish.add(ban); }
// starfield
{ const n = 900, p = new Float32Array(n * 3); for (let i = 0; i < n; i++) { p[i * 3] = rand(-60, 60); p[i * 3 + 1] = rand(4, 50); p[i * 3 + 2] = rand(-DIST - 60, 30); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x9fa8ff, size: 0.18, transparent: true, opacity: 0.8, depthWrite: false }))); }
// side city blocks (neon towers) for depth
{ const geo = new THREE.BoxGeometry(1, 1, 1); const mats = [0x1b1640, 0x101a3a, 0x24102e].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8, emissive: c, emissiveIntensity: 0.3 }));
  const winM = [0x3df5ff, 0xff2d95, 0xffc83d].map(c => new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(1.6) }));
  for (let z = 10; z > -DIST - 50; z -= 6) for (const s of [-1, 1]) {
    const h = rand(2, 14), w = rand(1.5, 3.5), b = new THREE.Mesh(geo, mats[Math.floor(Math.random() * 3)]);
    b.scale.set(w, h, rand(2, 5)); b.position.set(s * (TW / 2 + 3 + w / 2 + rand(0, 4)), h / 2 - 0.2, z + rand(-2, 2)); scene.add(b);
    const strip = new THREE.Mesh(geo, winM[Math.floor(Math.random() * 3)]); strip.scale.set(0.06, h * 0.8, 0.06); strip.position.set(b.position.x - s * w / 2, h * 0.45, b.position.z); scene.add(strip);
  } }

// confetti
const CN = 500, conf = []; const confM = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.09, 0.05), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, toneMapped: false }), CN);
confM.frustumCulled = false; confM.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(confM);
const CC = [0xff2d55, 0xffc83d, 0x3df5ff, 0xb9a8ff, 0x7dff9a, 0xffffff];
for (let i = 0; i < CN; i++) { conf.push({ on: false, p: new THREE.Vector3(), v: new THREE.Vector3(), r: new THREE.Euler(), w: new THREE.Vector3(), life: 0 }); confM.setColorAt(i, new THREE.Color(CC[i % CC.length]).multiplyScalar(1.4)); }
let cHead = 0;
function confetti(x, y, z, n, up = 7) { for (let k = 0; k < n; k++) { const c = conf[cHead]; cHead = (cHead + 1) % CN; c.on = true; c.life = rand(2.5, 4); c.p.set(x + rand(-0.3, 0.3), y, z); c.v.set(rand(-3, 3), rand(up * 0.6, up), rand(-2, 2)); c.r.set(rand(0, 6), rand(0, 6), 0); c.w.set(rand(-9, 9), rand(-9, 9), rand(-9, 9)); } }
// boost trail particles
const TN = 400, trail = []; const trailGeo = new THREE.BufferGeometry(); const tPos = new Float32Array(TN * 3), tCol = new Float32Array(TN * 3);
trailGeo.setAttribute('position', new THREE.BufferAttribute(tPos, 3)); trailGeo.setAttribute('color', new THREE.BufferAttribute(tCol, 3));
const glowTex = (() => { const cv = document.createElement('canvas'); cv.width = cv.height = 64; const x = cv.getContext('2d'); const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,255,255,.5)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(cv); })();
scene.add(new THREE.Points(trailGeo, new THREE.PointsMaterial({ size: 0.5, map: glowTex, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })));
for (let i = 0; i < TN; i++) { trail.push({ life: 0, x: 0, y: -99, z: 0, vx: 0, vy: 0, vz: 0, c: new THREE.Color() }); }
let tHead = 0;
function emitTrail(x, y, z, color, n) { for (let k = 0; k < n; k++) { const p = trail[tHead]; tHead = (tHead + 1) % TN; p.life = rand(0.3, 0.6); p.max = p.life; p.x = x + rand(-0.25, 0.25); p.y = y + rand(-0.2, 0.2); p.z = z + rand(0, 0.3); p.vx = rand(-0.5, 0.5); p.vy = rand(0.2, 1.2); p.vz = rand(1, 3); p.c.set(color); } }

// ================= racers =================
const COLORS = ['#3df5ff', '#ffc83d', '#ff2d95', '#7dff9a', '#b9a8ff', '#ff7a1f', '#ff2d55', '#4d9bff'];
function flagTexture(flag) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256; const x = cv.getContext('2d');
  x.fillStyle = '#f4f4f8'; x.fillRect(0, 0, 512, 256);
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = '118px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) x.fillText(flag, 64 + i * 128, 66 + j * 128);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const ballGeo = new THREE.SphereGeometry(0.5, 40, 24), ringGeo = new THREE.TorusGeometry(0.62, 0.05, 8, 40);
function laneX(i) { return -TW / 2 + LANE_W / 2 + i * LANE_W; }
function freeLane() { for (let i of [3, 4, 2, 5, 1, 6, 0, 7]) if (!G.racers.some(r => r.lane === i)) return i; return -1; }
function addRacer(iso) {
  let lane = freeLane();
  if (lane < 0) {
    // replace the quietest racer that has been inactive for a while
    const cand = G.racers.filter(r => G.time - r.lastAct > 15).sort((a, b) => a.lastAct - b.lastAct)[0];
    if (!cand) return null;
    removeRacer(cand); lane = cand.lane;
  }
  const c = BY.get(iso), color = COLORS[lane % COLORS.length];
  const grp = new THREE.Group();

  gates.forEach((g, i) => { g.children[0].material.color.setHSL(((G.time * 0.1 + i * 0.1) % 1), 1, 0.6).multiplyScalar(1.6); });
  // trails
  for (let i = 0; i < TN; i++) { const p = trail[i]; if (p.life > 0) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; const k = Math.max(0, p.life / p.max); tPos[i * 3] = p.x; tPos[i * 3 + 1] = p.y; tPos[i * 3 + 2] = p.z; tCol[i * 3] = p.c.r * k; tCol[i * 3 + 1] = p.c.g * k; tCol[i * 3 + 2] = p.c.b * k; } else tPos[i * 3 + 1] = -99; }
  trailGeo.attributes.position.needsUpdate = true; trailGeo.attributes.color.needsUpdate = true;
  // confetti
  for (let i = 0; i < CN; i++) { const c = conf[i]; if (!c.on) { M4.makeScale(0, 0, 0); confM.setMatrixAt(i, M4); continue; }
    c.life -= dt; if (c.life <= 0) { c.on = false; continue; } c.v.y -= 7 * dt; c.v.multiplyScalar(1 - Math.min(0.9, dt * 1.5)); if (c.v.y < -1.2) c.v.y = -1.2;
    c.p.addScaledVector(c.v, dt); c.r.x += c.w.x * dt; c.r.y += c.w.y * dt; c.r.z += c.w.z * dt; Q.setFromEuler(c.r); S3.setScalar(Math.min(1, c.life * 2)); M4.compose(c.p, Q, S3); confM.setMatrixAt(i, M4); }
  confM.instanceMatrix.needsUpdate = true;
  composer.render();
  drawHUD(dt);
}

const DEMO_C = ['Brasil 🇧🇷', 'USA!!', 'mexico', 'Portugal', 'colombia', '🇦🇷', 'peru', 'Japan', 'nigeria', 'philippines', 'España', 'go brazil', 'vamos mexico', 'India'];
let demoAcc = 0;
function demoTick(dt) {
  demoAcc += dt; if (demoAcc < 0.45 || G.phase !== 'race') return; demoAcc = 0;
  const nick = DEMO_U[Math.floor(Math.random() * DEMO_U.length)], r = Math.random();
  if (r < 0.55) onChat({ uid: nick, nick, comment: Math.random() < 0.4 ? DEMO_C[Math.floor(Math.random() * DEMO_C.length)] : 'lets goooo' });

// ================= live connection + setup =================
let ws = null, wsRetry = 0;
const store = { get(k, d) { try { const v = localStorage.getItem('race.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('race.' + k, JSON.stringify(v)); } catch {} } };
const cfg = { user: store.get('user', '') };
$('user').value = cfg.user;
function setStatus(m, c) { $('status').textContent = m; $('status').style.color = c || '#9a94b8'; }
function connect() {
  if (!cfg.user) return;
  try { if (ws) { ws.onclose = null; ws.close(); } } catch {}
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?user=' + encodeURIComponent(cfg.user.replace(/^@/, ''));
  try { ws = new WebSocket(url); } catch { setStatus('Could not reach the server.', '#ff6b6b'); return; }
  ws.onopen = () => { wsRetry = 0; };
  ws.onmessage = (m) => {
    let e; try { e = JSON.parse(m.data); } catch { return; }
    if (e.type === 'status') setStatus(e.msg, e.state === 'connected' ? '#3ddc84' : '#ffd23d');
    else if (e.type === 'gift') onGift(e); else if (e.type === 'like') onLike(e); else if (e.type === 'chat') onChat(e);
    else if (e.type === 'follow') onFollow(e); else if (e.type === 'share') onShare(e); else if (e.type === 'join') onJoin(e);
  };
  ws.onclose = () => { setTimeout(connect, Math.min(15000, 1000 * Math.pow(2, wsRetry++))); };
}
function begin(demo) {
  cfg.user = $('user').value.trim().replace(/^@/, ''); store.set('user', cfg.user);
  if (!demo && !cfg.user) { setStatus('Type your TikTok @ first.', '#ff6b6b'); return; }
  G.demo = demo; G.started = true; $('setup').classList.add('hidden');
  if (!demo) connect();
  if (G.race === 0) startRace();
}
$('go').onclick = () => begin(false);
$('demo').onclick = () => begin(true);
$('menu').onclick = () => $('setup').classList.remove('hidden');
seedRacers();
requestAnimationFrame(tick);
window.__race = { G, onChat, onGift, onLike, onFollow, onShare, detectCountry, startRace };
